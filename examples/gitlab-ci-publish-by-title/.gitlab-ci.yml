stages:
  - deploy

publish-confluence:
  image: python:3.10-slim
  stage: deploy

  variables:
    CONFLUENCE_DEPLOYMENT: "server"
    CONFLUENCE_VERIFY_SSL: "true"
    CONFLUENCE_SPACE_KEY: "DOC"
    CONFLUENCE_PAGE_TITLE: "Документация проекта"
    MARKDOWN_FILE: "docs/documentation.md"

  before_script:
    - python -m pip install --upgrade pip setuptools wheel
    - >-
      python -m pip install --no-build-isolation
      -e ./confluence-client
      -e ./confluence-markdown-service

  script:
    - python examples/gitlab-ci-publish-by-title/publish_markdown.py

  rules:
    - changes:
        - docs/**/*
